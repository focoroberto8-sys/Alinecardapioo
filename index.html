
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastel da Aline — Cardápio Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0A0503;
    --surface: #1A0F0A;
    --surface-2: #271510;
    --surface-3: #3A2117;
    --red: #C8272B;
    --red-2: #F0574A;
    --gold: #F0B23D;
    --gold-2: #FFD27A;
    --cream: #F5E9DA;
    --cream-2: #D9C0A0;
    --muted: #8C7261;
    --green: #8FBE5B;
    --shadow: 0 8px 26px rgba(0,0,0,0.5);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    background:var(--black);
    color:var(--cream);
    padding-bottom:88px;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', sans-serif;
    color:var(--cream);
    margin:0;
  }
  .mono{font-family:'Space Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  .icon{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;}
  .container{max-width:760px;margin:0 auto;padding:0 18px;}

  /* ===== HERO ===== */
  .hero{
    position:relative;
    background:radial-gradient(130% 90% at 50% 0%, #2A150C 0%, #150B06 48%, #060302 100%);
    color:var(--cream);
    padding:22px 18px 44px;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(circle, rgba(255,255,255,0.5) 1px, transparent 1.4px);
    background-size:28px 28px;
    opacity:0.05;
    pointer-events:none;
  }
  .hero-inner{max-width:520px;margin:0 auto;position:relative;z-index:2;text-align:center;}
  .hero-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    text-align:left; margin-bottom:30px;
  }
  .hero-brand{display:flex; align-items:center; gap:10px;}
  .hero-brand img{width:40px; height:40px; border-radius:100px; object-fit:cover; box-shadow:0 0 0 2px rgba(240,178,61,0.35);}
  .hero-brand span{font-family:'Baloo 2'; font-weight:700; font-size:14px; letter-spacing:0.04em; color:var(--cream);}
  .status-pill{
    display:flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; color:var(--cream-2);
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
    padding:6px 11px; border-radius:100px; white-space:nowrap;
  }
  .status-dot{width:7px; height:7px; border-radius:100px; background:var(--green); box-shadow:0 0 0 3px rgba(143,190,91,0.25);}
  .hero-logo-wrap{position:relative; width:220px; height:220px; margin:0 auto 20px;}
  .hero-logo-glow{
    position:absolute; inset:-30px; border-radius:100%;
    background:radial-gradient(circle, rgba(240,178,61,0.35) 0%, rgba(200,39,43,0.12) 55%, transparent 75%);
    filter:blur(6px);
  }
  .hero-logo-wrap img{
    position:relative; width:100%; height:100%; border-radius:100%; object-fit:cover;
    box-shadow:0 14px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(240,178,61,0.25);
  }
  .eyebrow{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-2);
  }
  .hero p{
    margin:12px auto 0;
    max-width:38ch;
    color:var(--cream-2);
    font-size:15px;
    line-height:1.55;
  }
  .price-note{
    margin-top:14px; font-size:12px; color:var(--muted); line-height:1.5; max-width:36ch; margin-left:auto; margin-right:auto;
  }
  .hero-tagline-wrap{margin-top:34px; padding-top:22px; border-top:1px solid rgba(255,255,255,0.08);}
  .hero-tagline{font-family:'Baloo 2'; font-size:19px; color:var(--gold-2); font-weight:600;}
  .hero-tagline-cap{margin-top:4px; font-size:12px; color:var(--muted);}

  /* ===== NAV ===== */
  .catnav-wrap{
    position:sticky; top:0; z-index:40;
    background:rgba(10,5,3,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .catnav{
    display:flex; gap:8px; overflow-x:auto;
    padding:12px 18px; max-width:760px; margin:0 auto;
    scrollbar-width:none;
  }
  .catnav::-webkit-scrollbar{display:none;}
  .catnav a{
    flex:0 0 auto;
    font-size:13.5px; font-weight:600;
    padding:8px 14px; border-radius:100px;
    background:var(--surface-2); color:var(--cream-2);
    border:1px solid rgba(255,255,255,0.07);
    white-space:nowrap;
    text-decoration:none;
  }
